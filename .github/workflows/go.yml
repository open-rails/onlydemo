name: go
# Vet plus the billing and channel end-to-end proofs (PGroonga, MinIO).
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'migrations/**'
      - 'homepage.html'
      - '.github/workflows/go.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: go-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: end-to-end
    if: '!github.event.pull_request.draft'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOFLAGS: -mod=readonly
      DEMO_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
      DEMO_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      DEMO_TEST_S3_ACCESS_KEY: minioadmin
      DEMO_TEST_S3_SECRET_KEY: minioadmin
    services:
      postgres:
        image: groonga/pgroonga:4.0.8-debian-18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install libvips (the media worker links it)
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libvips-dev
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.9'
      - run: go vet ./...
      # Needs only PostgreSQL: it runs before the S3-backed channel proof.
      - name: NMI billing end to end (nmimock)
        run: go test -run TestNMIBillingEndToEnd -count=1 -v -p 2 .
      - name: MinIO
        # Upstream MinIO images and dl.min.io binaries are gone; Chainguard still builds it (RELEASE.2026-09-22T19-25-18Z).
        run: >-
          docker run -d --name minio -p 9000:9000 --tmpfs /data:uid=65532,gid=65532
          cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1 server /data
      - run: |
          timeout 60 sh -c 'until curl -fs http://127.0.0.1:9000/minio/health/live; do sleep 1; done'
          go test -run TestChannelsOnContentKit -count=1 -v -p 2 .
