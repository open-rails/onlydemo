name: go
# Vet plus the media end-to-end proof and smoke walkthrough (libvips, ffmpeg, PGroonga, MinIO).
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'migrations/**'
      - 'homepage.html'
      - '.github/workflows/go.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: go-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: end-to-end
    if: '!github.event.pull_request.draft'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOFLAGS: -mod=readonly
      DEMO_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
      DEMO_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      DEMO_TEST_S3_ACCESS_KEY: minioadmin
      DEMO_TEST_S3_SECRET_KEY: minioadmin
      DEMO_TEST_MEDIA_ACCESS: /tmp/media-access
      DEMO_TEST_MEDIA_WORKER: /tmp/media-worker
      DEMO_TEST_FFMPEG: '1'
    services:
      postgres:
        image: groonga/pgroonga:4.0.8-debian-18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install libvips and ffmpeg
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libvips-dev ffmpeg
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.6'
      - run: go vet ./...
      # Needs only PostgreSQL: it runs before the S3-backed media proof.
      - name: NMI billing end to end (nmimock)
        run: go test -run TestNMIBillingEndToEnd -count=1 -v -p 2 .
      - name: MinIO
        run: docker run -d --name minio -p 9000:9000 quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
      - run: |
          go build -o /tmp/media-access github.com/open-rails/contentkit/cmd/media-access
          go build -o /tmp/media-worker github.com/open-rails/contentkit/cmd/media-worker
      - run: |
          timeout 60 sh -c 'until curl -fs http://127.0.0.1:9000/minio/health/live; do sleep 1; done'
          go test -run TestMediaEndToEnd -count=1 -v -p 2 .
      - name: Smoke
        env:
          SMOKE_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
          MEDIA_S3_ENDPOINT: http://127.0.0.1:9000
          MEDIA_S3_ACCESS_KEY_ID: minioadmin
          MEDIA_S3_SECRET_ACCESS_KEY: minioadmin
          MEDIA_URL: http://127.0.0.1:9
          MEDIA_DELIVERY: url
          MEDIA_TOKEN_KEY: smoke:c21va2Utb25seS1ub3QtYS1zZWNyZXQtMzItYnl0ZXM=
        run: |
          docker run --rm --network host --entrypoint sh quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z \
            -c 'mc alias set local http://127.0.0.1:9000 minioadmin minioadmin && mc mb -p local/onlydemo-media'
          go run -tags smoke .
