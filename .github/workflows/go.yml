name: go
# Vet plus the billing and channel end-to-end proofs (PGroonga, MinIO).
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'migrations/**'
      - 'homepage.html'
      - 'frontend/**'
      - '!frontend/dist/**'
      - '.github/workflows/go.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: go-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: end-to-end
    if: '!github.event.pull_request.draft'
    # The downloadable CGO/libvips binary must run on Ubuntu 24.04 workstations.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOWORK: 'off'
      GOFLAGS: -mod=readonly
      DEMO_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
      DEMO_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      DEMO_TEST_S3_ACCESS_KEY: minioadmin
      DEMO_TEST_S3_SECRET_KEY: minioadmin
    services:
      postgres:
        image: groonga/pgroonga:4.0.8-debian-18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: '11.15.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build the embedded frontend
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend build
      - name: Refresh native package indexes
        timeout-minutes: 3
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          # The runner's Azure mirror can throttle native package downloads.
          # Keep Ubuntu's signed repository, using its canonical HTTPS mirror.
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$source" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source"
            fi
          done
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
      - name: Install libvips (the media worker links it)
        timeout-minutes: 5
        run: sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends libvips-dev
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.10'
      - run: go vet ./...
      - name: Account notification binding and purge
        run: go test -run 'TestBillingAccountsFailClosedBeforeBinding|TestAccountNotifications' -count=1 -v -p 2 .
      # Needs only PostgreSQL: it runs before the S3-backed channel proof.
      - name: NMI billing end to end (nmimock)
        run: go test -run 'TestNMIBillingEndToEnd|TestProviderWritesReadOnly' -count=1 -v -p 2 .
      - name: MinIO
        # Upstream MinIO images and dl.min.io binaries are gone; Chainguard still builds it (RELEASE.2026-09-22T19-25-18Z).
        run: >-
          docker run -d --name minio -p 9000:9000 --tmpfs /data:uid=65532,gid=65532
          cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1 server /data
      - run: |
          timeout 60 sh -c 'until curl -fs http://127.0.0.1:9000/minio/health/live; do sleep 1; done'
          go test -run "TestChannelsOnContentKit|TestSmoke|TestSeed" -count=1 -v -p 2 .
      - name: Build the browser QA binary
        run: |
          go build -p 2 -o onlydemo .
          git rev-parse HEAD > build-head.txt
          go version -m onlydemo > build-metadata.txt
          ldd onlydemo > runtime-libs.txt
          tar -czf onlydemo-linux-amd64.tar.gz onlydemo build-head.txt build-metadata.txt runtime-libs.txt
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: onlydemo-linux-amd64
          path: onlydemo-linux-amd64.tar.gz
          retention-days: 7
          if-no-files-found: error
