name: Validate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.6'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.15.1'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips-dev
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend lint
      - run: pnpm --dir frontend build
      - run: go build ./...
      - run: go vet ./...
      - run: go build -tags smoke -o /tmp/demo-smoke .

  media:
    name: media end-to-end
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -mod=readonly
      DEMO_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable
      DEMO_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      DEMO_TEST_S3_ACCESS_KEY: minioadmin
      DEMO_TEST_S3_SECRET_KEY: minioadmin
      DEMO_TEST_MEDIA_ACCESS: /tmp/media-access
    services:
      postgres:
        image: groonga/pgroonga:4.0.8-debian-18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.6'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips-dev
      - name: MinIO
        run: |
          docker run -d --name minio -p 9000:9000 quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for i in $(seq 60); do curl -fs http://127.0.0.1:9000/minio/health/live && exit 0; sleep 1; done; exit 1
      - run: go build -o /tmp/media-access github.com/open-rails/contentkit/cmd/media-access
      - run: go test -run TestMediaEndToEnd -count=1 -v -p 2 .
