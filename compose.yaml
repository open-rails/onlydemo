# Local services: PostgreSQL and MinIO (the media bucket). media-gateway runs
# as a local process (task media:gateway) at the ContentKit version in go.mod.
name: onlydemo
services:
  postgres:
    image: groonga/pgroonga:4.0.8-debian-18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: onlydemo
    ports: ["127.0.0.1:55433:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30
  minio:
    # Upstream MinIO images are gone; Chainguard still builds it (the digest CI uses).
    image: cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: onlydemo
      MINIO_ROOT_PASSWORD: onlydemo-dev-secret
    ports: ["127.0.0.1:59000:9000", "127.0.0.1:59001:9001"]
    volumes: ["minio:/data"]
volumes:
  minio:
