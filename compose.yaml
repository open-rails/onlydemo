# Local services: PostgreSQL and MinIO (the media bucket). media-access runs
# as a local process (task media:access) at the ContentKit version in go.mod.
name: onlydemo
services:
  postgres:
    image: groonga/pgroonga:4.0.8-debian-18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: onlydemo
    ports: ["127.0.0.1:55433:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 30
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: onlydemo
      MINIO_ROOT_PASSWORD: onlydemo-dev-secret
    ports: ["127.0.0.1:59000:9000", "127.0.0.1:59001:9001"]
  bucket:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on: [minio]
    entrypoint: ["sh", "-c", "until mc alias set local http://minio:9000 onlydemo onlydemo-dev-secret; do sleep 1; done; mc mb -p local/onlydemo-media"]
