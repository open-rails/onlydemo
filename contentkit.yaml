# OnlyDemo's content model for ContentKit (contentkit.Config). Media
# presets, schemas and secrets are wired in contentkit.go.
tenant: onlydemo
content:
  languages: [en]
  kinds:
    # A creator post: one hidden version holding mixed images and videos,
    # owned by its channel (owner_group_id), never a member of it.
    post:
      route: p
      presentation: post
      versions: {languages: one, hidden: true}
      sort: newest
  entity_kinds:
    # A creator channel: owned by a user, governed by its AuthKit group
    # (auth_scope), sold as a membership; cover and avatar image slots.
    channel:
      route: c
      owner: user
      entitled: true
      auth_scope: true
      # Per editor: 60 files an hour, 100 GiB a day; 500 GiB stored per channel.
      uploads: {files_per_hour: 60, bytes_per_day: 107374182400, quota_bytes: 536870912000}
