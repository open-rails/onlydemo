version: '3'

dotenv: ['.env']

vars:
  POSTGRES_CONTAINER: openrails-demo-postgres
  POSTGRES_IMAGE: postgres:18-alpine
  POSTGRES_PORT: '55433'
  STRIPE_BIN: '{{.STRIPE_BIN | default "stripe"}}'

tasks:
  db:up:
    desc: Start the local PostgreSQL container
    cmds:
      - >-
        docker run --name {{.POSTGRES_CONTAINER}}
        -e POSTGRES_USER=postgres
        -e POSTGRES_PASSWORD=postgres
        -e POSTGRES_DB=openrails_demo
        -p {{.POSTGRES_PORT}}:5432
        -d {{.POSTGRES_IMAGE}}

  db:down:
    desc: Stop and remove the local PostgreSQL container
    cmds:
      - docker rm -f {{.POSTGRES_CONTAINER}}

  db:logs:
    desc: Follow local PostgreSQL logs
    cmds:
      - docker logs -f {{.POSTGRES_CONTAINER}}

  db:roles:
    desc: Configure the local unprivileged billing login after migrations
    cmds:
      - docker exec -i {{.POSTGRES_CONTAINER}} psql -U postgres -d postgres -v ON_ERROR_STOP=1 < scripts/db-role.sql

  migrate:
    desc: Apply embedded PostgreSQL migrations with migratekit
    env:
      MIGRATIONS_ONLY: 'true'
    cmds:
      - go run .

  run:
    desc: Run the API against local PostgreSQL
    cmds:
      - go run .

  admin:grant:
    desc: Grant an existing user's AuthKit admin role (USER_ID required)
    requires:
      vars: [USER_ID]
    env:
      ADMIN_ONLY: 'true'
      ADMIN_USER_ID: '{{.USER_ID}}'
    cmds:
      - go run .

  admin:revoke:
    desc: Revoke an existing user's AuthKit admin role (USER_ID required)
    requires:
      vars: [USER_ID]
    env:
      ADMIN_ONLY: 'true'
      ADMIN_REVOKE: 'true'
      ADMIN_USER_ID: '{{.USER_ID}}'
    cmds:
      - go run .

  stripe:listen:
    desc: Forward Stripe test webhooks locally; copy its signing secret into .env
    cmds:
      - '{{.STRIPE_BIN}} listen --forward-to localhost:3000/billing/v1/merchants/openrails-demo/webhooks/stripe'
    env:
      STRIPE_API_KEY: '{{.STRIPE_SECRET_KEY}}'

  test:
    desc: Run Go tests
    cmds:
      - go test ./...
