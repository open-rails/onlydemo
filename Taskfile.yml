version: '3'

dotenv: ['.env']

vars:
  AIR_BIN: '{{.AIR_BIN | default "air"}}'

tasks:
  dev:up:
    desc: Start local PostgreSQL and MinIO with the media bucket (idempotent)
    cmds:
      - docker compose up -d --wait postgres minio
      - docker compose run --rm bucket

  migrate:
    desc: Initialize application and library storage
    cmds:
      - go run . migrate

  dev:down:
    desc: Stop and remove the local services and their data
    cmds:
      - docker compose down -v

  media:access:
    desc: Run the media access worker (ContentKit cmd/media-access at the go.mod version)
    cmds:
      - |
        MEDIA_ACCESS_LISTEN="${MEDIA_ACCESS_LISTEN:-127.0.0.1:8090}" \
        MEDIA_ACCESS_S3_ENDPOINT="$MEDIA_S3_ENDPOINT" \
        MEDIA_ACCESS_S3_BUCKET="${MEDIA_S3_BUCKET:-onlydemo-media}" \
        MEDIA_ACCESS_S3_ACCESS_KEY_ID="$MEDIA_S3_ACCESS_KEY_ID" \
        MEDIA_ACCESS_S3_SECRET_ACCESS_KEY="$MEDIA_S3_SECRET_ACCESS_KEY" \
        MEDIA_ACCESS_TOKEN_KEY="$MEDIA_TOKEN_KEY" \
        MEDIA_ACCESS_TOKEN_KEY_PREVIOUS="${MEDIA_TOKEN_KEY_PREVIOUS:-}" \
        MEDIA_ACCESS_CORS_ORIGINS="${MEDIA_ACCESS_CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}" \
        go run github.com/open-rails/contentkit/cmd/media-access

  media:worker:
    desc: Run the video encode worker (ContentKit cmd/media-worker at the go.mod version; needs ffmpeg)
    cmds:
      - |
        MEDIA_WORKER_THREADS="${MEDIA_WORKER_THREADS:-2}" \
        go run github.com/open-rails/contentkit/cmd/media-worker

  run:
    desc: Migrate, then run Go with Air, Vite, the media access worker and the video worker (task dev:up first)
    cmds:
      - task: migrate
      - |
        set -e
        pnpm --dir frontend dev --host 127.0.0.1 &
        FRONTEND_PID=$!
        task media:access &
        MEDIA_PID=$!
        task media:worker &
        WORKER_PID=$!
        trap 'kill "$FRONTEND_PID" "$MEDIA_PID" "$WORKER_PID" 2>/dev/null || true' EXIT INT TERM
        PUBLIC_URL="${DEV_PUBLIC_URL:-http://localhost:5173}" {{.AIR_BIN}} -c air.toml

  run:embedded:
    desc: Migrate, build the embedded frontend and run the standalone Go binary (task dev:up first)
    deps: [frontend:build]
    cmds:
      - task: migrate
      - |
        set -e
        task media:access &
        MEDIA_PID=$!
        task media:worker &
        WORKER_PID=$!
        trap 'kill "$MEDIA_PID" "$WORKER_PID" 2>/dev/null || true' EXIT INT TERM
        go run . serve

  seed:
    desc: Create display channels and posts through the running server's API
    cmds:
      - go run . seed {{.CLI_ARGS}}

  frontend:build:
    desc: Build the React application
    cmds:
      - pnpm --dir frontend install --frozen-lockfile
      - pnpm --dir frontend build

  frontend:dev:
    desc: Run Vite with API requests forwarded to port 3000
    cmds:
      - pnpm --dir frontend dev

  admin:grant:
    desc: Grant an existing user's AuthKit admin role (USER_ID required)
    requires:
      vars: [USER_ID]
    cmds:
      - go run . admin grant --user-id {{.USER_ID | shellQuote}}

  admin:revoke:
    desc: Revoke an existing user's AuthKit admin role (USER_ID required)
    requires:
      vars: [USER_ID]
    cmds:
      - go run . admin revoke --user-id {{.USER_ID | shellQuote}}

  stripe:listen:
    desc: Forward Stripe test webhooks locally; copy its signing secret into .env
    requires:
      vars: [STRIPE_SECRET_KEY, STRIPE_ACCOUNT_ID]
    cmds:
      - |
        stripe_cli="$(command -v stripe || true)"
        if [ -z "$stripe_cli" ] && [ -x .runtime/bin/stripe ]; then stripe_cli=.runtime/bin/stripe; fi
        test -n "$stripe_cli" || { echo 'stripe CLI not found on PATH or .runtime/bin/stripe' >&2; exit 1; }
        "$stripe_cli" listen --all-snapshot --forward-to "localhost:3000/billing/v1/webhooks/stripe/$STRIPE_ACCOUNT_ID"
    env:
      STRIPE_API_KEY: '{{.STRIPE_SECRET_KEY}}'

  check:
    desc: Build and vet the demo
    deps: [frontend:build]
    cmds:
      - pnpm --dir frontend lint
      - go build ./...
      - go vet ./...

  smoke:
    desc: Run the optional local fake-payment walkthrough
    cmds:
      - scripts/smoke.sh

  test:media:
    desc: Media end-to-end test on the local PostgreSQL and MinIO (task dev:up first)
    cmds:
      - go test -run TestMediaEndToEnd -count=1 -v .
    env:
      DEMO_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:55433/postgres?sslmode=disable
      DEMO_TEST_S3_ENDPOINT: http://127.0.0.1:59000
      DEMO_TEST_S3_ACCESS_KEY: onlydemo
      DEMO_TEST_S3_SECRET_KEY: onlydemo-dev-secret
