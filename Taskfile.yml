version: '3'

dotenv: ['.env']

vars:
  AIR_BIN: '{{.AIR_BIN | default "air"}}'

tasks:
  dev:up:
    desc: Start local PostgreSQL and MinIO with the media bucket (idempotent)
    cmds:
      - docker compose up -d --wait postgres minio
      # The media bucket; 409 is "already yours".
      - |
        code=$(curl -s -o /dev/null -w '%{http_code}' --retry 15 --retry-all-errors --retry-delay 1 \
          --aws-sigv4 aws:amz:us-east-1:s3 --user onlydemo:onlydemo-dev-secret -X PUT http://127.0.0.1:59000/onlydemo-media)
        test "$code" = 200 || test "$code" = 409

  migrate:
    desc: Initialize application and library storage
    cmds:
      - go run . migrate

  dev:down:
    desc: Stop and remove the local services and their data
    cmds:
      - docker compose down -v

  media:gateway:
    desc: Run the media gateway (ContentKit cmd/media-gateway at the go.mod version)
    cmds:
      - |
        MEDIA_GATEWAY_LISTEN="${MEDIA_GATEWAY_LISTEN:-127.0.0.1:8090}" \
        MEDIA_GATEWAY_S3_ENDPOINT="$MEDIA_S3_ENDPOINT" \
        MEDIA_GATEWAY_S3_BUCKET="${MEDIA_S3_BUCKET:-onlydemo-media}" \
        MEDIA_GATEWAY_S3_ACCESS_KEY_ID="$MEDIA_S3_ACCESS_KEY_ID" \
        MEDIA_GATEWAY_S3_SECRET_ACCESS_KEY="$MEDIA_S3_SECRET_ACCESS_KEY" \
        MEDIA_GATEWAY_TOKEN_KEY="$MEDIA_TOKEN_KEY" \
        MEDIA_GATEWAY_TOKEN_KEY_PREVIOUS="${MEDIA_TOKEN_KEY_PREVIOUS:-}" \
        MEDIA_GATEWAY_CORS_ORIGINS="${MEDIA_GATEWAY_CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}" \
        MEDIA_GATEWAY_HOSTS="${MEDIA_GATEWAY_HOSTS:-localhost=onlydemo; 127.0.0.1=onlydemo}" \
        go run github.com/open-rails/contentkit/cmd/media-gateway

  media:worker:
    desc: Run the media worker (`onlydemo media-worker`; needs libvips and ffmpeg). It places uploads and renders images and video; readiness goes back to the app's River queue
    cmds:
      - |
        MEDIA_WORKER_THREADS="${MEDIA_WORKER_THREADS:-2}" \
        MEDIA_HOST_RIVER_SCHEMA="${RIVER_SCHEMA:-public}" \
        go run . media-worker

  run:
    desc: Migrate, then run Go with Air, Vite, the media gateway and the media worker (task dev:up first)
    cmds:
      - task: migrate
      - |
        set -e
        pnpm --dir frontend dev --host 127.0.0.1 &
        FRONTEND_PID=$!
        task media:gateway &
        MEDIA_PID=$!
        task media:worker &
        WORKER_PID=$!
        trap 'kill "$FRONTEND_PID" "$MEDIA_PID" "$WORKER_PID" 2>/dev/null || true' EXIT INT TERM
        PUBLIC_URL="${DEV_PUBLIC_URL:-http://localhost:5173}" {{.AIR_BIN}} -c air.toml

  run:embedded:
    desc: Migrate, build the embedded frontend and run the standalone Go binary (task dev:up first)
    deps: [frontend:build]
    cmds:
      - task: migrate
      - |
        set -e
        task media:gateway &
        MEDIA_PID=$!
        task media:worker &
        WORKER_PID=$!
        trap 'kill "$MEDIA_PID" "$WORKER_PID" 2>/dev/null || true' EXIT INT TERM
        go run . serve

  seed:
    desc: Create display channels and posts through the running server's routes
    cmds:
      - go run . seed {{.CLI_ARGS}}

  smoke:
    desc: Walk the running server through a creator's and a fan's journeys
    cmds:
      - go run . smoke {{.CLI_ARGS}}

  frontend:build:
    desc: Build the React application
    cmds:
      - pnpm --dir frontend install --frozen-lockfile
      - pnpm --dir frontend build

  frontend:dev:
    desc: Run Vite with API requests forwarded to port 3000
    cmds:
      - pnpm --dir frontend dev

  admin:grant:
    desc: Grant an existing user's AuthKit admin role (USER_ID required)
    requires:
      vars: [USER_ID]
    cmds:
      - go run . admin grant --user-id {{.USER_ID | shellQuote}}

  admin:revoke:
    desc: Revoke an existing user's AuthKit admin role (USER_ID required)
    requires:
      vars: [USER_ID]
    cmds:
      - go run . admin revoke --user-id {{.USER_ID | shellQuote}}

  stripe:listen:
    desc: Forward Stripe test webhooks locally; copy its signing secret into .env
    requires:
      vars: [STRIPE_SECRET_KEY, STRIPE_ACCOUNT_ID]
    cmds:
      - |
        stripe_cli="$(command -v stripe || true)"
        if [ -z "$stripe_cli" ] && [ -x .runtime/bin/stripe ]; then stripe_cli=.runtime/bin/stripe; fi
        test -n "$stripe_cli" || { echo 'stripe CLI not found on PATH or .runtime/bin/stripe' >&2; exit 1; }
        "$stripe_cli" listen --all-snapshot --forward-to "localhost:3000/billing/v1/webhooks/stripe/$STRIPE_ACCOUNT_ID"
    env:
      STRIPE_API_KEY: '{{.STRIPE_SECRET_KEY}}'

  check:
    desc: Build and vet the demo
    deps: [frontend:build]
    cmds:
      - pnpm --dir frontend lint
      - pnpm --dir frontend test
      - go build ./...
      - go vet ./...

  test:channels:
    desc: Channels on ContentKit, on the local PostgreSQL and MinIO (task dev:up first)
    cmds:
      - go test -run TestChannelsOnContentKit -count=1 -v .
    env:
      DEMO_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:55433/onlydemo?sslmode=disable
      DEMO_TEST_S3_ENDPOINT: http://127.0.0.1:59000
      DEMO_TEST_S3_ACCESS_KEY: onlydemo
      DEMO_TEST_S3_SECRET_KEY: onlydemo-dev-secret
  test:nmi:
    desc: NMI billing end-to-end test against nmimock on the local PostgreSQL (task dev:up first)
    cmds:
      - go test -run TestNMIBillingEndToEnd -count=1 -v .
    env:
      DEMO_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:55433/onlydemo?sslmode=disable
