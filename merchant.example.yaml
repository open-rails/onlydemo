# Copy to merchant.yaml (gitignored): the seller and its sandbox PSPs. Startup
# refuses a PSP whose credentials are not sandbox. MERCHANT_FILE names another path.
slug: onlydemo
display_name: OnlyDemo
psps:
  stripe:
    rail: stripe
    account_id: acct_... # the Stripe account id
    settings:
      publishable_key: pk_test_... # in-page card entry (Stripe Elements)
    secrets:
      secret_key: sk_test_... # or rk_test_
      webhook_signing_secret: whsec_... # from task stripe:listen
  # nmi:
  #   rail: nmi
  #   account_id: "000000" # the NMI dashboard's "Gateway ID"
  #   settings:
  #     tokenization_key: your-public-tokenization-key # Collect.js
  #     endpoint_deployment: gateway # or sandbox
  #   secrets:
  #     security_key: your-test-mode-security-key
  #     webhook_signing_secret: your-webhook-signing-key
# With several PSPs, the one new purchases and cards use:
# settings:
#   checkout_routing: [{prefer: [stripe]}]
