<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1117" />
    <meta
      name="description"
      content="Discover independent channels, support creators, and keep the stories you buy."
    />
    <title>OpenRails — Independent stories</title>
    <script>
      try {
        const t = localStorage.getItem("openrails-theme");
        document.documentElement.classList.toggle(
          "dark",
          t === "dark" ||
            (!t && matchMedia("(prefers-color-scheme: dark)").matches),
        );
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
